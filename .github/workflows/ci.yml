name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7 (Linux)
        run: |
          curl -L -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot

      - name: Import project
        run: godot --headless --import

      - name: Smoke test (preloaded A/B run)
        run: |
          godot --headless --path . --script res://tests/run_ab_test.gd -- --mode=preload | tee ab.log
          grep -q "HITCHTEST RESULT" ab.log
